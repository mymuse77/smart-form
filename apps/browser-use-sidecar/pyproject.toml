[project]
name = "browser-use-sidecar"
version = "0.1.0"
description = "Browser Use Python Sidecar — 阶段 0 技术 Spike"
requires-python = ">=3.12"
dependencies = [
    "browser-use>=0.2.0",
    "langchain-openai>=0.3.0",
    "playwright>=1.50.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
