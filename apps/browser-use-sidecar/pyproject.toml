[project]
name = "browser-use-sidecar"
version = "0.1.0"
description = "Browser Use worker controlled by the Smart Form Desktop agent"
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.2.0",
    "langchain-openai>=0.3.0",
    "playwright>=1.50.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
smart-form-sidecar = "smart_form_sidecar.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_form_sidecar"]
