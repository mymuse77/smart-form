<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测试靶场 1：企业公开采购列表</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 24px; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { font-size: 20px; margin-bottom: 16px; color: #1a1a1a; }
    .search-bar { display: flex; gap: 12px; margin-bottom: 20px; }
    input[type="text"] { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; flex: 1; }
    button { padding: 8px 16px; background: #1a1a1a; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #e8e8e8; padding: 12px; text-align: left; font-size: 14px; }
    th { background: #fafafa; color: #5f6368; font-weight: 600; }
    tr:hover { background: #f9f9f9; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #e8e8e8; color: #333; }
    .tag.active { background: #34a853; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>智能表单采集测试 — 采购项目列表 (普通表格)</h1>
    <div class="search-bar">
      <label for="keyword" style="display:none">搜索关键词</label>
      <input type="text" id="keyword" placeholder="输入采购项目关键词..." />
      <button id="search-btn" type="button" aria-label="搜索按钮">查询</button>
    </div>
    <table id="project-table">
      <thead>
        <tr>
          <th>编号</th>
          <th>项目名称</th>
          <th>采购预算(万元)</th>
          <th>发布日期</th>
          <th>状态</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>PRJ-2026-001</td>
          <td>云计算服务器硬件采购项目</td>
          <td>150.00</td>
          <td>2026-07-20</td>
          <td><span class="tag active">招标中</span></td>
        </tr>
        <tr>
          <td>PRJ-2026-002</td>
          <td>办公桌面终端重置项目</td>
          <td>45.50</td>
          <td>2026-07-21</td>
          <td><span class="tag active">招标中</span></td>
        </tr>
        <tr>
          <td>PRJ-2026-003</td>
          <td>安全防火墙与网关升级项目</td>
          <td>88.00</td>
          <td>2026-07-22</td>
          <td><span class="tag">已截止</span></td>
        </tr>
        <tr>
          <td>PRJ-2026-004</td>
          <td>智能自动化采集组件研发</td>
          <td>120.00</td>
          <td>2026-07-25</td>
          <td><span class="tag active">招标中</span></td>
        </tr>
      </tbody>
    </table>
  </div>
  <script>
    document.getElementById('search-btn').addEventListener('click', function() {
      const kw = document.getElementById('keyword').value.trim().toLowerCase();
      const rows = document.querySelectorAll('#project-table tbody tr');
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(kw) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
