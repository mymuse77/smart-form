<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测试靶场 2：供应商名录 (分页列表)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 24px; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { font-size: 20px; margin-bottom: 16px; color: #1a1a1a; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #e8e8e8; padding: 12px; text-align: left; font-size: 14px; }
    th { background: #fafafa; color: #5f6368; font-weight: 600; }
    .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 20px; }
    .page-btn { padding: 6px 12px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .page-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-info { font-size: 13px; color: #666; margin-right: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>智能表单采集测试 — 合规供应商名录 (动态分页)</h1>
    <table id="supplier-table">
      <thead>
        <tr>
          <th>供应商ID</th>
          <th>企业名称</th>
          <th>评级</th>
          <th>注册资本</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- 动态渲染 -->
      </tbody>
    </table>
    <div class="pagination">
      <span class="page-info" id="page-info">第 1 / 3 页</span>
      <button class="page-btn" id="prev-btn" disabled>上一页</button>
      <button class="page-btn active" data-page="1">1</button>
      <button class="page-btn" data-page="2">2</button>
      <button class="page-btn" data-page="3">3</button>
      <button class="page-btn" id="next-btn">下一页</button>
    </div>
  </div>

  <script>
    const mockData = {
      1: [
        { id: 'SUP-001', name: '极智云图科技有限公司', rating: 'AAA', capital: '5,000 万元' },
        { id: 'SUP-002', name: '恒信数安网络基础设施有限公司', rating: 'AA+', capital: '2,000 万元' },
        { id: 'SUP-003', name: '远大电子智能终端股份有限公司', rating: 'AAA', capital: '10,000 万元' },
      ],
      2: [
        { id: 'SUP-004', name: '深蓝动力算法研究院有限公司', rating: 'AA', capital: '1,500 万元' },
        { id: 'SUP-005', name: '博远微电子技术设备有限公司', rating: 'AAA', capital: '8,000 万元' },
        { id: 'SUP-006', name: '新世纪数据集成服务有限公司', rating: 'A+', capital: '800 万元' },
      ],
      3: [
        { id: 'SUP-007', name: '光华光电感知芯片有限公司', rating: 'AAA', capital: '3,200 万元' },
        { id: 'SUP-008', name: '天创智能软件系统有限公司', rating: 'AA+', capital: '1,200 万元' },
      ]
    };

    let currentPage = 1;

    function renderPage(page) {
      currentPage = page;
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      const list = mockData[page] || [];
      list.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.id}</td>
          <td>${item.name}</td>
          <td>${item.rating}</td>
          <td>${item.capital}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('page-info').textContent = `第 ${currentPage} / 3 页`;
      document.getElementById('prev-btn').disabled = currentPage === 1;
      document.getElementById('next-btn').disabled = currentPage === 3;

      document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.page) === currentPage);
      });
    }

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentPage > 1) renderPage(currentPage - 1);
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentPage < 3) renderPage(currentPage + 1);
    });

    document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        renderPage(parseInt(e.target.dataset.page));
      });
    });

    renderPage(1);
  </script>
</body>
</html>
