<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能表单 - 填报受控测试靶场</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
    .form-card { max-width: 540px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    h2 { margin-bottom: 20px; color: #38bdf8; font-size: 20px; }
    .form-item { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { background: #0284c7; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    button:hover { background: #0369a1; }
    #result-box { margin-top: 20px; padding: 12px; background: #064e3b; border-radius: 6px; border: 1px solid #10b981; display: none; }
  </style>
</head>
<body>
  <div class="form-card">
    <h2>📋 采购申报系统 (受控填报靶场)</h2>
    <form id="test-form" onsubmit="handleSubmit(event)">
      <div class="form-item">
        <label for="applicant">申请人姓名 (Native Input)</label>
        <input type="text" id="applicant" name="applicant" placeholder="请输入申请人姓名" required />
      </div>

      <div class="form-item">
        <label for="projectName">项目名称 (React/Vue 受控组件模拟)</label>
        <input type="text" id="projectName" name="projectName" placeholder="请输入项目名称" required />
      </div>

      <div class="form-item">
        <label for="category">采购类别</label>
        <select id="category" name="category">
          <option value="hardware">IT 硬件设备</option>
          <option value="software">软件服务许可</option>
          <option value="office">办公用品</option>
        </select>
      </div>

      <div class="form-item">
        <label for="budget">预算金额 (元)</label>
        <input type="number" id="budget" name="budget" placeholder="请输入预算金额" required />
      </div>

      <button type="submit" id="submit-btn">确认提交申请</button>
    </form>

    <div id="result-box">
      🎉 <strong>提交成功！</strong><br />
      回执单号：<span id="receipt-id"></span>
    </div>
  </div>

  <script>
    let submittedCount = 0;
    function handleSubmit(e) {
      e.preventDefault();
      submittedCount++;
      const applicant = document.getElementById('applicant').value;
      const projectName = document.getElementById('projectName').value;
      const receiptId = 'REC-' + Date.now() + '-' + Math.floor(Math.random()*1000);

      document.getElementById('receipt-id').innerText = receiptId + ' (提交次数:' + submittedCount + ')';
      document.getElementById('result-box').style.display = 'block';
    }
  </script>
</body>
</html>
